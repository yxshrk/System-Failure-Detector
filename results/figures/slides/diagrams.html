<!DOCTYPE html>

<head>

<title>AI Pre-Mortems: presentation diagrams</title>
<style>
  :root { color-scheme: light; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #efeeea; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0 0 28px; color: var(--ink2); font-size: 15px; line-height: 1.5; }
  figure { margin: 0 0 40px; }
  .frame { background: var(--surface); aspect-ratio: 16 / 9; width: 100%; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  svg { display: block; width: 100%; height: 100%; }
  svg text { font-family: Arial, Helvetica, sans-serif; fill: #0b0b0b; }
  svg .mono { white-space: pre; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; font-family: Menlo, ui-monospace, monospace; }
  svg .muted { fill: #52514e; }
</style>
</head>
<body>
<main>
<header>
  <h1>Presentation diagrams</h1>
  <p>Each panel is drawn at the size of its slot in the deck (the slide carries the title). Arial for text, Menlo for code; blue only for Direct, orange only for Translate. Rendered to the PNGs in <code>results/figures/slides/</code> with headless Chrome at 2x.</p>
</header>

<!-- 2. SP1 worked example                                          -->
<!-- ============================================================= -->
<figure>
<div class="frame">
<svg id="worked_example" viewBox="40 160 1520 632" role="img" aria-label="Worked example. A days_in_month function whose leap-year check uses 399 instead of 400 fails on only 7 of 36,000 inputs. 1,000 random inputs find it 18% of the time. Opus 5.5 Direct answers February 2000; Opus 5.5 Translate writes a spec and Z3 returns February 2400. Both are confirmed against the reference.">
  <!-- code panel -->
  <rect x="60" y="170" width="720" height="560" rx="14" fill="#f4f3f0"/>
  <rect x="60" y="208" width="720" height="38" fill="#f6ecc2"/>
  <g class="mono" font-size="19">
    <text x="84" y="202" class="mono">def leap(y):</text>
    <text x="84" y="234" class="mono">    return y % 4 == 0 and (y % 100 != 0 or y % <tspan font-weight="700">399</tspan> == 0)</text>
    <text x="84" y="298" class="mono">def days_in_month(month, year):</text>
    <text x="84" y="330" class="mono" style="fill:#52514e">    """... February has 29 days in leap</text>
    <text x="84" y="362" class="mono" style="fill:#52514e">    years (divisible by 4, except years</text>
    <text x="84" y="394" class="mono" style="fill:#52514e">    divisible by 100 unless also divisible</text>
    <text x="84" y="426" class="mono" style="fill:#52514e">    by <tspan font-weight="700" style="fill:#0b0b0b">400</tspan>) and 28 otherwise; ..."""</text>
    <text x="84" y="458" class="mono">    if month == 2:</text>
    <text x="84" y="490" class="mono">        return 29 if leap(year) else 28</text>
    <text x="84" y="522" class="mono">    if month in (4, 6, 9, 11):</text>
    <text x="84" y="554" class="mono">        return 30</text>
    <text x="84" y="586" class="mono">    return 31</text>
  </g>
  <line x1="84" y1="630" x2="756" y2="630" stroke="#e4e3df" stroke-width="2"/>
  <text x="84" y="668" font-size="20"><tspan font-weight="700">Mutation:</tspan> constant 400 → 399 in <tspan class="mono">leap</tspan></text>
  <text x="84" y="702" font-size="20" class="muted">Docstring says 400, code says 399.</text>

  <!-- card 1: random testing -->
  <rect x="820" y="170" width="720" height="170" rx="14" fill="#fff" stroke="#e4e3df" stroke-width="2"/>
  <rect x="820" y="170" width="10" height="170" rx="4" fill="#b5b3ad"/>
  <text x="860" y="212" font-size="20" font-weight="700" letter-spacing="1.5" class="muted">RANDOM TESTING</text>
  <text x="860" y="290" font-size="64" font-weight="700">18%</text>
  <text x="1010" y="262" font-size="21">chance that 1,000 random inputs</text>
  <text x="1010" y="292" font-size="21">hit a failing one</text>
  <text x="1010" y="322" font-size="18" class="muted">(2% with 100 inputs)</text>

  <!-- card 2: Direct -->
  <rect x="820" y="365" width="720" height="170" rx="14" fill="#fff" stroke="#e4e3df" stroke-width="2"/>
  <rect x="820" y="365" width="10" height="170" rx="4" fill="#2a78d6"/>
  <text x="860" y="407" font-size="20" font-weight="700" letter-spacing="1.5" style="fill:#2a78d6">OPUS 5.5 · DIRECT</text>
  <text x="860" y="455" font-size="28" font-weight="700" class="mono">month = 2, year = 2000</text>
  <text x="860" y="492" font-size="19">Paraphrased: 2000 is divisible by 400, so February has 29 days,</text>
  <text x="860" y="520" font-size="19">but 2000 % 399 is 5, so the code returns 28.</text>

  <!-- card 3: Translate -->
  <rect x="820" y="560" width="720" height="170" rx="14" fill="#fff" stroke="#e4e3df" stroke-width="2"/>
  <rect x="820" y="560" width="10" height="170" rx="4" fill="#eb6834"/>
  <text x="860" y="602" font-size="20" font-weight="700" letter-spacing="1.5" style="fill:#eb6834">OPUS 5.5 · TRANSLATE</text>
  <text x="860" y="650" font-size="20">Writes the requirement from the docstring (the 400 rule)</text>
  <text x="860" y="702" font-size="20">Z3 returns</text>
  <text x="975" y="702" font-size="26" font-weight="700" class="mono">month = 2, year = 2400</text>
  <text x="1390" y="702" font-size="20" class="muted">in 0.01 s</text>

  <text x="1180" y="774" font-size="19" text-anchor="middle">The two arms name different years; any year divisible by 400 exposes the bug.</text>

</svg>
</div>
</figure>
